name: Build pixel art

# Regenerates assets/*.svg whenever the generator changes (or run it manually)
on:
  push:
    branches: [main]
    paths: ["tools/pixel_gen.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate pixel art
        run: python tools/pixel_gen.py
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: regenerate pixel art assets" && git push)
