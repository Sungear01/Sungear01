<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Currently leveling up</title>
  <desc id="d">Practicing Figma prototyping and wireframing. Learning design systems and user research. Exploring accessibility.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#6fc3b2"/>
      <stop offset="0.55" stop-color="#8aa4e6"/>
      <stop offset="1" stop-color="#b5a3e0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#e6e9ef" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6e9ef" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e6e9ef" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="270" y="98" width="290" height="12" rx="6"/></clipPath>
    <clipPath id="c2"><rect x="270" y="146" width="262" height="12" rx="6"/></clipPath>
    <clipPath id="c3"><rect x="270" y="194" width="190" height="12" rx="6"/></clipPath>
    <clipPath id="c4"><rect x="270" y="242" width="170" height="12" rx="6"/></clipPath>
    <clipPath id="c5"><rect x="270" y="290" width="115" height="12" rx="6"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #6fc3b2; }
    .sub { font-size: 14px; fill: #a3acbd; }
    .skill { font-size: 15px; font-weight: 600; fill: #e6e9ef; }
    .tag { font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .fill { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .shine { animation: sweep 3s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-120px); } 60%, 100% { transform: translateX(420px); } }
    .row { opacity: 0; animation: in .6s ease forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }
  </style>

  <rect x="0.5" y="0.5" width="799" height="329" rx="14" fill="#1e2330" stroke="#323a4b"/>
  <text x="32" y="46" class="title">Currently leveling up</text>
  <text x="32" y="70" class="sub">A beginner's honest progress in UX/UI — updated as I grow</text>
  <circle cx="760" cy="40" r="5" fill="#8fd19e" class="blink"/>

  <!-- row 1 -->
  <g class="row" style="animation-delay:.1s">
    <text x="32" y="109" class="skill">Figma prototyping</text>
    <rect x="270" y="98" width="380" height="12" rx="6" fill="#323a4b"/>
    <rect x="270" y="98" width="290" height="12" rx="6" fill="url(#g)" class="fill" style="animation-delay:.3s"/>
    <g clip-path="url(#c1)"><rect x="270" y="98" width="80" height="12" fill="url(#shine)" class="shine"/></g>
    <rect x="672" y="93" width="96" height="22" rx="11" fill="#6fc3b2" fill-opacity=".18" stroke="#6fc3b2"/>
    <text x="720" y="104" class="tag" fill="#9fdccf">Practicing</text>
  </g>

  <!-- row 2 -->
  <g class="row" style="animation-delay:.25s">
    <text x="32" y="157" class="skill">Wireframing &amp; user flows</text>
    <rect x="270" y="146" width="380" height="12" rx="6" fill="#323a4b"/>
    <rect x="270" y="146" width="262" height="12" rx="6" fill="url(#g)" class="fill" style="animation-delay:.45s"/>
    <g clip-path="url(#c2)"><rect x="270" y="146" width="80" height="12" fill="url(#shine)" class="shine" style="animation-delay:.3s"/></g>
    <rect x="672" y="141" width="96" height="22" rx="11" fill="#6fc3b2" fill-opacity=".18" stroke="#6fc3b2"/>
    <text x="720" y="152" class="tag" fill="#9fdccf">Practicing</text>
  </g>

  <!-- row 3 -->
  <g class="row" style="animation-delay:.4s">
    <text x="32" y="205" class="skill">Design systems</text>
    <rect x="270" y="194" width="380" height="12" rx="6" fill="#323a4b"/>
    <rect x="270" y="194" width="190" height="12" rx="6" fill="url(#g)" class="fill" style="animation-delay:.6s"/>
    <g clip-path="url(#c3)"><rect x="270" y="194" width="80" height="12" fill="url(#shine)" class="shine" style="animation-delay:.6s"/></g>
    <rect x="672" y="189" width="96" height="22" rx="11" fill="#8aa4e6" fill-opacity=".18" stroke="#8aa4e6"/>
    <text x="720" y="200" class="tag" fill="#b4c4ee">Learning</text>
  </g>

  <!-- row 4 -->
  <g class="row" style="animation-delay:.55s">
    <text x="32" y="253" class="skill">User research</text>
    <rect x="270" y="242" width="380" height="12" rx="6" fill="#323a4b"/>
    <rect x="270" y="242" width="170" height="12" rx="6" fill="url(#g)" class="fill" style="animation-delay:.75s"/>
    <g clip-path="url(#c4)"><rect x="270" y="242" width="80" height="12" fill="url(#shine)" class="shine" style="animation-delay:.9s"/></g>
    <rect x="672" y="237" width="96" height="22" rx="11" fill="#8aa4e6" fill-opacity=".18" stroke="#8aa4e6"/>
    <text x="720" y="248" class="tag" fill="#b4c4ee">Learning</text>
  </g>

  <!-- row 5 -->
  <g class="row" style="animation-delay:.7s">
    <text x="32" y="301" class="skill">Accessibility (WCAG)</text>
    <rect x="270" y="290" width="380" height="12" rx="6" fill="#323a4b"/>
    <rect x="270" y="290" width="115" height="12" rx="6" fill="url(#g)" class="fill" style="animation-delay:.9s"/>
    <g clip-path="url(#c5)"><rect x="270" y="290" width="80" height="12" fill="url(#shine)" class="shine" style="animation-delay:1.2s"/></g>
    <rect x="672" y="285" width="96" height="22" rx="11" fill="#b5a3e0" fill-opacity=".18" stroke="#b5a3e0"/>
    <text x="720" y="296" class="tag" fill="#cfc3ec">Exploring</text>
  </g>
</svg>
