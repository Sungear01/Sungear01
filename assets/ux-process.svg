<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">My UX/UI design process</title>
  <desc id="d">Five steps: Empathize, Define, Ideate, Prototype, Test.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6fc3b2"/>
      <stop offset="0.5" stop-color="#8aa4e6"/>
      <stop offset="1" stop-color="#b5a3e0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b5a3e0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b5a3e0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #6fc3b2; }
    .sub { font-size: 14px; fill: #a3acbd; }
    .num { font-size: 22px; font-weight: 700; fill: #e6e9ef; text-anchor: middle; dominant-baseline: central; }
    .label { font-size: 16px; font-weight: 700; fill: #e6e9ef; text-anchor: middle; }
    .hint { font-size: 12.5px; fill: #a3acbd; text-anchor: middle; }
    .draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 6s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 600; } 45%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -600; } }
    .node { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
    .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 5s ease-out infinite; }
    @keyframes ring { 0% { opacity: .8; transform: scale(1); } 20%, 100% { opacity: 0; transform: scale(1.7); } }
    .fade { opacity: 0; animation: fade .8s ease forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect x="0.5" y="0.5" width="799" height="299" rx="14" fill="#1e2330" stroke="#323a4b"/>
  <text x="32" y="46" class="title">My UX/UI design process</text>
  <text x="32" y="70" class="sub">How I turn an idea into something people enjoy using</text>

  <!-- track + animated line -->
  <line x1="100" y1="160" x2="700" y2="160" stroke="#323a4b" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="160" x2="700" y2="160" stroke="url(#g)" stroke-width="4" stroke-linecap="round" class="draw"/>

  <!-- traveling spark -->
  <circle r="14" fill="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M100,160 H700"/>
  </circle>
  <circle r="4" fill="#e6e9ef">
    <animateMotion dur="5s" repeatCount="indefinite" path="M100,160 H700"/>
  </circle>

  <!-- step 1 -->
  <circle cx="100" cy="160" r="32" fill="none" stroke="#6fc3b2" stroke-width="2" class="ring" style="animation-delay:0s"/>
  <g class="node" style="animation-delay:.1s">
    <circle cx="100" cy="160" r="32" fill="#1e2330" stroke="url(#g)" stroke-width="3"/>
    <text x="100" y="160" class="num">1</text>
  </g>
  <g class="fade" style="animation-delay:.4s">
    <text x="100" y="225" class="label">Empathize</text>
    <text x="100" y="246" class="hint">Listen to users</text>
  </g>

  <!-- step 2 -->
  <circle cx="250" cy="160" r="32" fill="none" stroke="#7fb3d5" stroke-width="2" class="ring" style="animation-delay:1s"/>
  <g class="node" style="animation-delay:.35s">
    <circle cx="250" cy="160" r="32" fill="#1e2330" stroke="url(#g)" stroke-width="3"/>
    <text x="250" y="160" class="num">2</text>
  </g>
  <g class="fade" style="animation-delay:.65s">
    <text x="250" y="225" class="label">Define</text>
    <text x="250" y="246" class="hint">Find the real problem</text>
  </g>

  <!-- step 3 -->
  <circle cx="400" cy="160" r="32" fill="none" stroke="#8aa4e6" stroke-width="2" class="ring" style="animation-delay:2s"/>
  <g class="node" style="animation-delay:.6s">
    <circle cx="400" cy="160" r="32" fill="#1e2330" stroke="url(#g)" stroke-width="3"/>
    <text x="400" y="160" class="num">3</text>
  </g>
  <g class="fade" style="animation-delay:.9s">
    <text x="400" y="225" class="label">Ideate</text>
    <text x="400" y="246" class="hint">Sketch many ideas</text>
  </g>

  <!-- step 4 -->
  <circle cx="550" cy="160" r="32" fill="none" stroke="#a0a3e3" stroke-width="2" class="ring" style="animation-delay:3s"/>
  <g class="node" style="animation-delay:.85s">
    <circle cx="550" cy="160" r="32" fill="#1e2330" stroke="url(#g)" stroke-width="3"/>
    <text x="550" y="160" class="num">4</text>
  </g>
  <g class="fade" style="animation-delay:1.15s">
    <text x="550" y="225" class="label">Prototype</text>
    <text x="550" y="246" class="hint">Build it in Figma</text>
  </g>

  <!-- step 5 -->
  <circle cx="700" cy="160" r="32" fill="none" stroke="#b5a3e0" stroke-width="2" class="ring" style="animation-delay:4s"/>
  <g class="node" style="animation-delay:1.1s">
    <circle cx="700" cy="160" r="32" fill="#1e2330" stroke="url(#g)" stroke-width="3"/>
    <text x="700" y="160" class="num">5</text>
  </g>
  <g class="fade" style="animation-delay:1.4s">
    <text x="700" y="225" class="label">Test</text>
    <text x="700" y="246" class="hint">Learn &amp; improve</text>
  </g>
</svg>
